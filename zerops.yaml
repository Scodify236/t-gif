zerops:
  - setup: docker
    run:
      base: docker@26.1

      # pull your image from GitHub Container Registy
      prepareCommands:
        - docker pull ghcr.io/shashwat-coding/laughing-potato:main@sha256:aed2f025baa100d37710670b5d0802d889e2fda255948a44c54498ec854e171c

      # run your container
      start: docker run --network=host ghcr.io/shashwat-coding/laughing-potato:main@sha256:aed2f025baa100d37710670b5d0802d889e2fda255948a44c54498ec854e171c

      # expose port (change if your app uses something else)
      ports:
        - port: 7860
          httpSupport: true
