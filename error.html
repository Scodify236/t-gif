<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GCVX_IMS</title>
<style>
  :root {
    --bg-1: #0a0a0a;
    --card: #141414;
    --border: #262626;
    --border-highlight: #404040;
    --text-1: #ffffff;
    --text-2: #a3a3a3;
    --danger: #f87171;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: ui-monospace, SFMono-Regular, Consolas, "Segoe UI", sans-serif;
    background: var(--bg-1);
    color: var(--text-1);
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }

  .wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 420px;
    max-width: 90vw;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0px;
    padding: 40px 36px;
    text-align: center;
    box-shadow: 0 0 0 1px #000000, 0 20px 50px rgba(0,0,0,0.9);
  }

  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .logo-badge {
    padding: 4px 10px;
    border-radius: 0px;
    background: #1f1f1f;
    border: 1px solid #333333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    color: #ffffff;
  }

  .logo-text {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .icon {
    margin: 10px auto 24px auto;
    width: 56px;
    height: 56px;
    opacity: 0.8;
  }

  h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 0 12px 0;
  }

  p.msg {
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-2);
    margin: 0 0 24px 0;
  }

  #status {
    min-height: 18px;
    font-size: 11px;
    color: var(--danger);
    margin-bottom: 16px;
    letter-spacing: 0.5px;
  }

  button#retryBtn {
    background: #ffffff;
    color: #000000;
    border: 1px solid #ffffff;
    padding: 10px 30px;
    border-radius: 0px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
    transition: background 0.1s linear;
  }

  button#retryBtn:hover:not(:disabled) {
    background: #e5e5e5;
  }

  button#retryBtn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .footer {
    margin-top: 24px;
    font-size: 10px;
    color: #525252;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo">
        <div class="logo-badge">SYS</div>
        <div class="logo-text">GCVX_IMS</div>
      </div>

      <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="18" height="18" stroke="#737373" stroke-width="1.5"/>
        <path d="M8 12H16" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="square"/>
        <path d="M12 8V16" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="square"/>
        <line x1="4" y1="4" x2="20" y2="20" stroke="#f87171" stroke-width="1.5"/>
      </svg>

      <h1>SYSTEM DISCONNECTED</h1>
      <p class="msg">
        GCVX_IMS cannot establish a connection to target services.
        Please verify network connectivity or retry shortly.
      </p>

      <div id="status"></div>

      <button id="retryBtn" onclick="retryConnection()">RETRY CONNECTION</button>

      <div class="footer">GCVX_IMS CORPORATE WRAPPER</div>
    </div>
  </div>

  <script>
    let apiReady = false;
    window.addEventListener('pywebviewready', function () {
      apiReady = true;
    });

    async function retryConnection() {
      const btn = document.getElementById('retryBtn');
      const status = document.getElementById('status');

      btn.disabled = true;
      btn.innerText = 'CHECKING...';
      status.innerText = '';

      if (!apiReady && !(window.pywebview && window.pywebview.api)) {
        await new Promise(r => setTimeout(r, 400));
      }

      try {
        if (!(window.pywebview && window.pywebview.api)) {
          throw new Error('bridge_unavailable');
        }
        const result = await window.pywebview.api.retry();
        if (!result || !result.ok) {
          btn.disabled = false;
          btn.innerText = 'RETRY CONNECTION';
          const reason = result && result.reason;
          if (reason === 'no_internet') {
            status.innerText = 'NO INTERNET CONNECTION DETECTED.';
          } else {
            status.innerText = 'STILL UNABLE TO CONNECT. PLEASE RETRY SHORTLY.';
          }
        }
      } catch (e) {
        btn.disabled = false;
        btn.innerText = 'RETRY CONNECTION';
        status.innerText = 'STILL UNABLE TO CONNECT. PLEASE RETRY SHORTLY.';
      }
    }
  </script>
</body>
</html>
